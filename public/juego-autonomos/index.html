<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#071d3c">
  <title>Plan de Autónomos · Aprende jugando con Esther</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/complete.css">
  <link rel="stylesheet" href="css/viewport.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <header class="topbar">
    <button class="brand" data-action="home" aria-label="Volver al inicio">
      <img src="assets/img/logo-pp.png" alt="">
      <span><strong>Plan de Autónomos</strong><small>Aprende jugando con Esther</small></span>
    </button>
    <div class="top-actions">
      <div class="level-pill"><span>⭐</span><span><small>Nivel <b id="level">1</b></small><strong id="xp">0 XP</strong></span></div>
      <button class="icon-button" id="soundBtn" aria-label="Desactivar sonido" title="Sonido">🔊</button>
      <button class="icon-button" data-action="home" aria-label="Inicio" title="Inicio">⌂</button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <nav class="progress-dock" aria-label="Tu progreso">
    <div><strong id="progressPercent">0%</strong><span>Progreso</span></div>
    <div class="dock-bar"><i id="dockBar"></i></div>
    <div><strong id="achievementCount">0/8</strong><span>Logros</span></div>
    <button id="certificateBtn" disabled><strong>🎓</strong><span>Certificado</span></button>
  </nav>

  <dialog id="achievementDialog" class="achievement-dialog">
    <div class="trophy">🏆</div><p>¡Nuevo logro!</p><h2 id="achievementTitle"></h2>
    <button class="primary" onclick="this.closest('dialog').close()">¡Genial!</button>
  </dialog>

  <dialog id="chatDialog" class="chat-dialog">
    <div class="dialog-head"><div><strong>Esther</strong><small>Tu guía del Plan</small></div><button onclick="this.closest('dialog').close()" aria-label="Cerrar">×</button></div>
    <iframe src="https://esther-guia-pro.base44.app" title="Chat con Esther" allow="clipboard-read; clipboard-write"></iframe>
  </dialog>

  <script src="js/app.js?v=20260809-2"></script>
</body>
</html>
