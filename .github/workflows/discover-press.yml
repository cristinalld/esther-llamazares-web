name: Buscar noticias de Esther
on:
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar menciones y crear propuestas
        run: node scripts/discover-press.mjs
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          MAX_NEW: "5"
