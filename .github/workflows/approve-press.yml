name: Aprobar noticia de prensa
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
jobs:
  publish:
    if: github.event.label.name == 'prensa-aprobada'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Incorporar la noticia aprobada
        run: node scripts/approve-press.mjs
      - name: Guardar la noticia
        run: |
          if git diff --quiet -- data/press-auto.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/press-auto.json
          git commit -m "Publica noticia aprobada #\${{ github.event.issue.number }}"
          git push
      - name: Cerrar la propuesta
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
          ISSUE_URL: \${{ github.event.issue.html_url }}
        run: |
          gh issue edit "$ISSUE_URL" --remove-label "prensa-pendiente" --add-label "prensa-publicada"
          gh issue comment "$ISSUE_URL" --body "Noticia incorporada. La web se actualizará en unos minutos."
          gh issue close "$ISSUE_URL"
